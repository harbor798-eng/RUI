# ===== 数据源（MySQL 8.x，本地实例；按需修改） =====
# 真实本机凭据请放在 application-local.properties 或环境变量 RA_DB_URL/RA_DB_USERNAME/RA_DB_PASSWORD
db.url=jdbc:mysql://localhost:3306/relationship_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
db.username=root
db.password=YOUR_DATABASE_PASSWORD

# ===== Flyway =====
flyway.locations=classpath:db/migration

# ===== AI Provider（OpenAI 兼容协议；DeepSeek / Doubao / 自建网关均可填这里） =====
# 注意：真实 api-key 运行时由 AesCryptoService 加密落库，不写日志、不进入 Context；
# 此文件里的 api-key 只是占位。
ai.provider.name=openai-compatible
ai.provider.base-url=https://api.openai.com/v1
ai.provider.model=gpt-4o-mini
ai.provider.api-key=REPLACE_ME

# ===== 本地加密主密钥（V1：本地固定密钥；生产应换成系统密钥库生成。至少 16/24/32 字节） =====
# 本机真实密钥请放在 application-local.properties，不要提交真实值。
security.aes-key=REPLACE_WITH_LOCAL_32BYTE_KEY
